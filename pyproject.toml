[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrag-cfpb"
version = "0.1.0"
description = "Reproducible CFPB complaint intelligence data foundation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pyarrow>=14", "requests>=2.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
